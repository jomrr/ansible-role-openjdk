---
# role: openjdk
# file: tasks/main.yml

- name: OPENJDK | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __openjdk_platform_files) }}"
  vars:
    __openjdk_platform_files:
      files:
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: OPENJDK | Install packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __openjdk_packages[openjdk_type] }}"
    state: present
